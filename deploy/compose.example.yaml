# Reference two-container layout (plan §9; step by step in docs/install.md).
#
# Put this file, fukku.yaml (from fukku.example.yaml) and a secrets/ folder in one directory,
# replace every /path/to/..., then `docker compose up -d`.
#
# The web process holds the API keys and talks to Radarr, Sonarr, the subtitle manager and
# the media server. The worker opens untrusted uploads and has no network and no secrets.
# They share only the spool folder (task and result files) and the intake root.
#
# THE VERSION: the image tag below is the only place the release version is written. Pin by
# digest when you can: ghcr.io/segun-io/fukku:<version>@sha256:<digest>.

name: fukku

x-image: &image ghcr.io/segun-io/fukku:0.1.0

x-hardening: &hardening
  image: *image
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  restart: unless-stopped
  # Run as the user that owns the media files, the same one Radarr and Sonarr run as
  # (the PUID and PGID of their containers). This user must also own ./state.
  user: "1000:1000"

services:
  web:
    <<: *hardening
    command: ["web"]
    environment:
      FUKKU_CONFIG: /config/fukku.yaml
      FUKKU_RADARR_API_KEY_FILE: /run/secrets/radarr_api_key
      FUKKU_SONARR_API_KEY_FILE: /run/secrets/sonarr_api_key
      FUKKU_SUBTITLES_API_KEY_FILE: /run/secrets/bazarr_api_key
      FUKKU_MEDIA_SERVER_API_KEY_FILE: /run/secrets/jellyfin_api_key
    secrets: [radarr_api_key, sonarr_api_key, bazarr_api_key, jellyfin_api_key]
    volumes:
      - ./fukku.yaml:/config/fukku.yaml:ro
      # Bind mounts, not named volumes: a new named volume is owned by the image's user
      # (10001), which cannot be the user above. Create them as that user (docs/install.md).
      - ./state/data:/var/lib/fukku        # SQLite database: local disk, never network storage
      - ./state/spool:/spool
      # The filesystem that holds downloads, the library and the intake root. Mount it at
      # the same path Radarr and Sonarr use, or set paths.mappings.* in fukku.yaml. Writable:
      # the web process writes the intake root and, with versions.enabled, second versions
      # (versions.root, and Sonarr's season folders for episodes).
      - /path/to/data:/data
    networks:
      # Reach Radarr, Sonarr, Bazarr and Jellyfin ...
      media: {}
      # ... and be reachable by the reverse proxy only: the one network the proxy joins, at
      # the fixed address that auth.trustedProxies names (docs/reverse-proxy.md).
      frontend:
        aliases: [fukku-web]
    expose: ["8080"]
    # Limits (docs/settings.md, worker.toolMemoryLimit): the web process streams uploads and
    # keeps a SQLite database, so 1g is ample; raise it only if the logs show it killed.
    # memswap_limit equal to mem_limit means no swap: a runaway process is killed by the
    # kernel inside its own container, not by the host's OOM killer picking Radarr or Jellyfin.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256

  worker:
    <<: *hardening
    command: ["worker"]
    network_mode: none                    # no network at all
    environment:
      FUKKU_CONFIG: /config/fukku.yaml    # no API keys here: the worker refuses to start with any
    volumes:
      - ./fukku.yaml:/config/fukku.yaml:ro
      - ./state/spool:/spool
      - /path/to/data:/data:ro             # reads the library (flow 2: comparison, merge source), only under paths.libraryRoots ...
      - /path/to/data/intake:/data/intake  # ... and writes only into the intake root
    healthcheck:
      test: ["CMD", "fukku", "healthcheck", "--worker"]
      interval: 30s
      timeout: 5s
    # Limits: 4g covers one ffmpeg or mkvmerge at a time (worker.concurrency 1) with room for
    # the 64m /tmp; raise it with worker.concurrency. Each tool also runs under an address-space
    # limit of worker.toolMemoryLimit (6GiB by default; it counts reserved address space, so it
    # is above the real use). A tool past either limit fails its job with a clear refusal.
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256
    cpus: 2

networks:
  media:
    external: true    # the network Radarr, Sonarr, Bazarr and Jellyfin are on: replace its name
    name: media
  frontend:
    name: fukku-frontend
    ipam:
      config:
        - subnet: 172.29.50.0/24   # the proxy is 172.29.50.10 (auth.trustedProxies); change both if this range is taken

secrets:
  radarr_api_key:
    file: ./secrets/radarr_api_key
  sonarr_api_key:
    file: ./secrets/sonarr_api_key
  bazarr_api_key:
    file: ./secrets/bazarr_api_key
  jellyfin_api_key:
    file: ./secrets/jellyfin_api_key
