# Checks on every push and pull request; behaviour probes against the pinned apps.
# Actions are pinned by commit SHA; tools come from the pinned dev image (tools/dev).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: online probes catch upstream changes
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group: a push to main must not cancel the weekly scheduled run (the
# schedule runs on the default branch, the same ref), nor the other way round.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, test, UI, secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false # nothing here pushes; the token must not sit in .git/config
      - uses: ./.github/actions/dev-image
      - run: make check

  image:
    name: image build, smoke test and SBOM (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build amd64 only: arm64 runs under QEMU emulation and takes about an hour.
        # Pushes to main, the weekly schedule and manual runs build and smoke-test both.
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; the token must not sit in .git/config
      - uses: ./.github/actions/build-image
        with:
          tag: fukku:ci-${{ matrix.arch }}
          version: ci-${{ github.sha }}
          commit: ${{ github.sha }}
          platform: linux/${{ matrix.arch }}

  probes:
    name: behaviour probes (${{ github.event_name == 'pull_request' && 'offline' || 'online' }})
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; the token must not sit in .git/config
      - uses: ./.github/actions/dev-image
      - run: make env-up
      # Pull requests run the probes that need no internet; pushes, the schedule and manual
      # runs also run those that add titles through the *arr metadata services. The make target
      # runs the probes (a differs verdict fails its Go test, so go test exits non-zero on known
      # findings too) and then the gate, which alone decides the step: it fails on a differs or
      # error verdict not listed in test/probes/accepted.json (listed ones warn), on a failed test
      # without such a result, a panic or a build failure; a probe skipped because the upstream
      # metadata service was unavailable passes with a warning annotation.
      - run: make ${{ github.event_name == 'pull_request' && 'probes' || 'probes-online' }}
      - if: always()
        run: make compat || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-results
          path: |
            test/env/.run/results/
            test/env/.run/go-test.log
            docs/compatibility.md
      - if: always()
        run: make env-down

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; the token must not sit in .git/config
      - uses: ./.github/actions/dev-image
      # The large-upload test writes 5 GiB under test/env/.run/data (and checks there is room):
      # drop toolchains this job does not use.
      - name: free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      # Builds the image, starts the test environment and the dev stack, runs the tests in the
      # pinned Playwright image (browsers are not downloaded). As with the probes, pull requests
      # skip the tests tagged @online (the M2 and M3 exit criteria add titles through the *arr
      # metadata services); pushes, the schedule and manual runs include them.
      - run: make e2e E2E_ONLINE=${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: container logs
        if: failure()
        working-directory: test/env
        run: |
          docker compose --env-file .run/.env --env-file .run/dev.env -f compose.yaml --profile fukku \
            logs --no-color --timestamps fukku-web fukku-worker fukku-proxy mediacheck > ../e2e/container-logs.txt || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-and-logs
          path: |
            test/e2e/test-results/
            test/e2e/playwright-report/
            test/e2e/container-logs.txt
          if-no-files-found: ignore
      - if: always()
        run: make dev-down env-down

  # Known vulnerabilities in dependencies (#128). Needs the internet and moves with the advisory
  # databases, so it is a job of its own, not part of `make check`. What fails and what warns is
  # written at the top of tools/vulncheck.sh: a vulnerability in a Go function the code calls, or
  # a high or critical advisory in a production npm package of the UI, fails; the rest warns.
  #
  # It runs on pushes to main, the weekly schedule and manual runs. On a pull request it runs only
  # when what it scans can have changed (go.mod, go.sum, ui/package-lock.json, the Go image pin),
  # so a new advisory against the standard library does not turn every unrelated pull request red.
  vulncheck:
    name: dependency vulnerabilities (govulncheck, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(go\.mod|go\.sum|ui/package-lock\.json|Dockerfile|tools/dev/Dockerfile|tools/vulncheck\.sh)$'; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "No dependency file changed: the scan is skipped on this pull request (it runs on main and weekly)."
            echo "scan=false" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name != 'pull_request' || steps.changed.outputs.scan == 'true'
        uses: ./.github/actions/dev-image
      - if: github.event_name != 'pull_request' || steps.changed.outputs.scan == 'true'
        run: make vulncheck

  # Makes the weekly online probes visible (#66): opens one issue when a verdict differs from the
  # committed docs/compatibility.md or the gate fails, and comments on that issue instead of
  # opening another when the findings change (tools/probe-report.sh has the dedupe rules). Only
  # this job may write issues, with the workflow's own token. A manual run prints what it would
  # do and writes nothing.
  probe-report:
    name: probe report (issue on a changed verdict or a failed gate)
    # Also when `check` failed and the probes never ran: the scheduled run is then reported, not silent.
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.probes.result != 'cancelled' && needs.check.result != 'cancelled' }}
    needs: [check, probes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # a run that never got to the results has none: the report says so
        with:
          name: probe-results
          path: probe-results
      - name: open or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || '1' }}
          GATE: ${{ needs.probes.result == 'skipped' && format('not run (check {0})', needs.check.result) || needs.probes.result }}
        run: |
          # The artifact keeps the repository-relative paths of what the probes job uploaded.
          tools/probe-report.sh docs/compatibility.md probe-results/docs/compatibility.md "$GATE" | tee -a "$GITHUB_STEP_SUMMARY"
