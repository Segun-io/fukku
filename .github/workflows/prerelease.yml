# Pre-release image to GHCR (plan D5, issue #31). Manual only: no push, tag, schedule or pull
# request trigger. EVERY ACTUAL PUBLISH NEEDS THE MAINTAINER'S EXPLICIT OK; do not run this
# workflow with publish=true without it. publish=false is a dry run that pushes nothing.
# See docs/prerelease.md. Actions are pinned by commit SHA.
name: prerelease

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        type: string
        default: main
      publish:
        description: Push the image to GHCR (needs the maintainer's OK and approval of the prerelease environment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prerelease
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/segun-io/fukku

jobs:
  build:
    name: build and smoke test (no push)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: tag
        run: |
          commit=$(git rev-parse HEAD)
          tag="0.0.0-pre.$(date -u +%Y%m%d).${commit:0:7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-image
        with:
          tag: fukku:prerelease
          version: ${{ steps.tag.outputs.tag }}
          commit: ${{ steps.tag.outputs.commit }}
      - name: save the tested image
        run: docker save fukku:prerelease -o fukku-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fukku-image
          path: fukku-image.tar
          retention-days: 1
      - name: summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "Built and smoke-tested \`${IMAGE_NAME}:${TAG}\`; the publish job pushes exactly this image." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: nothing was pushed. A publish would use the tag \`${IMAGE_NAME}:${TAG}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: publish to GHCR
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    environment: prerelease # the maintainer's per-run approval (required reviewer)
    permissions:
      contents: read
      packages: write
      id-token: write # signs the attestations (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fukku-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fukku-amd64.spdx.json # the SBOM of the tested image (image and UI packages)
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: push the tested image and print its digest reference
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          docker load -i fukku-image.tar
          ref="${IMAGE_NAME}:${TAG}"
          docker tag fukku:prerelease "$ref"
          docker push "$ref" | tee push.log
          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -n 1)
          [ -n "$digest" ] || { echo "could not read the pushed digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Published. Copy this reference (pinned by digest):"
            echo
            echo '```'
            echo "${ref}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Attached to the pushed image in the registry (#127): the SBOM, and the build provenance.
      # Part of the release work (#66); not yet run: the first publish with the maintainer's OK
      # shows whether the repository's settings allow attestations.
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: fukku-amd64.spdx.json
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
