# Builds the product image for linux/amd64 into the local Docker daemon, smoke-tests it and
# writes its SBOM. Used by prerelease.yml so the build and the smoke test have one definition.
# (ci.yml's `image` job has the same steps; move it onto this action once #16 has landed.)
name: build and smoke-test the image
description: Build the Fukku image locally (nothing is pushed), run the smoke test, attach an SBOM.

inputs:
  tag:
    description: Local image reference to build, for example fukku:ci.
    required: true
  version:
    description: Value of the VERSION build argument.
    required: true
  commit:
    description: Value of the COMMIT build argument.
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        push: false
        tags: ${{ inputs.tag }}
        build-args: |
          VERSION=${{ inputs.version }}
          COMMIT=${{ inputs.commit }}
    - name: smoke test
      shell: bash
      env:
        IMAGE: ${{ inputs.tag }}
      run: |
        docker run --rm "$IMAGE" version
        docker run --rm --network none --read-only --cap-drop ALL --entrypoint sh "$IMAGE" -c 'ffprobe -version >/dev/null && mkvmerge --version'
    - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ inputs.tag }}
        syft-version: v1.57.1
        format: spdx-json
        artifact-name: fukku.spdx.json
