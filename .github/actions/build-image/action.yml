# Builds the product image for one platform into the local Docker daemon, smoke-tests it
# (tools/image-smoke.sh) and writes its SBOM. Used by ci.yml (one job per architecture) and by
# prerelease.yml, so the build and the smoke test have one definition. A platform other than
# the runner's is built and run under QEMU emulation. Nothing is pushed.
name: build and smoke-test the image
description: Build the Fukku image locally (nothing is pushed), run the smoke test, attach an SBOM.

inputs:
  tag:
    description: Local image reference to build, for example fukku:ci.
    required: true
  version:
    description: Value of the VERSION build argument.
    required: true
  commit:
    description: Value of the COMMIT build argument.
    required: true
  platform:
    description: Platform to build and test, linux/amd64 or linux/arm64.
    default: linux/amd64

runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: ${{ inputs.platform }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: ${{ inputs.platform }}
        load: true
        push: false
        tags: ${{ inputs.tag }}
        build-args: |
          VERSION=${{ inputs.version }}
          COMMIT=${{ inputs.commit }}
    - name: smoke test
      shell: bash
      env:
        IMAGE: ${{ inputs.tag }}
        PLATFORM: ${{ inputs.platform }}
      run: tools/image-smoke.sh "$IMAGE" "${PLATFORM#linux/}"
    - id: sbom-name
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: echo "name=fukku-${PLATFORM#linux/}.spdx.json" >> "$GITHUB_OUTPUT"
    - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ inputs.tag }}
        syft-version: v1.57.1
        format: spdx-json
        artifact-name: ${{ steps.sbom-name.outputs.name }}
