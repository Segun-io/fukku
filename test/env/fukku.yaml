# Configuration of the Fukku containers in the dev stack (profile fukku in compose.yaml).
# Read by both processes, so it holds no secrets: the API keys are given to the web process
# through its environment. Every setting: docs/settings.md.

server:
  # What the browser opens; the Origin check compares against it.
  publicBaseUrl: http://127.0.0.1:18080

auth:
  mode: proxyHeaders
  # The test proxy's address on the dev network (compose.yaml overrides it when
  # FUKKU_DEV_SUBNET is set).
  trustedProxies: [172.30.77.10]
  adminGroup: media-admins

radarr:
  url: http://radarr:7878
  qualityProfile: Fukku Probe
  rootFolder: /data/media/movies

sonarr:
  url: http://sonarr:8989
  qualityProfile: Fukku Probe
  rootFolder: /data/media/tv

# The post-processing steps of M2 (issue #47's exit criteria run them against the test Bazarr
# and Jellyfin). Both see the library filesystem at the same /data paths as Fukku.
subtitles:
  provider: bazarr
  url: http://bazarr:6767

mediaServer:
  provider: jellyfin
  url: http://jellyfin:8096
  # The test Jellyfin as the host publishes it (compose.yaml).
  titleLinkTemplate: http://127.0.0.1:18096/web/#/details?id={itemId}

paths:
  intakeRoot: /data/intake
  libraryRoots: [/data/media/movies, /data/media/tv]
  # Created by `make dev-up`: proves the shared filesystem is mounted.
  sentinels: [/data/.mounted]
