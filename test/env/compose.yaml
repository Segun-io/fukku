# Local integration environment (plan §14). Start it with `make env-up`; nothing here talks
# to any real instance. API keys are fixed fake values, valid only inside this environment.
#
# Everything shares one bind-mounted "library filesystem" at /data (test/env/.run/data):
#   /data/media/movies   Radarr root folder, Jellyfin "Movies" library
#   /data/media/tv       Sonarr root folder, Jellyfin "Shows" library
#   /data/intake         where probes put files for Manual Import
# so moves are renames and imports can be hardlinks, as in a real deployment.
#
# Versions are pinned by tag and digest. When you bump one, run `make probes-online` and
# update docs/compatibility.md.

name: fukku-test

x-servarr: &servarr
  restart: unless-stopped
  environment: &servarr-env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: Etc/UTC

# Shared by the two Fukku processes (profile fukku, below). Small limits so tests can reach
# them with small files; the settings are in docs/settings.md. The worker gets no secrets.
x-fukku-env: &fukku-env
  FUKKU_CONFIG: /config/fukku.yaml
  FUKKU_UPLOAD_CHUNK_SIZE: 1MiB
  FUKKU_UPLOAD_MAX_FILE_SIZE: 256MiB
  FUKKU_UPLOAD_MAX_IN_FLIGHT: 1GiB
  FUKKU_UPLOAD_FREE_SPACE_MARGIN: "0"
  # The proxy's address on the fukku network; dev-up derives it from FUKKU_DEV_SUBNET.
  FUKKU_AUTH_TRUSTED_PROXIES: ${FUKKU_DEV_PROXY_IP:-172.30.77.10}

x-fukku-hardening: &fukku-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  restart: unless-stopped
  # The user that owns ./.run/data, like Radarr and Sonarr here.
  user: ${PUID:-1000}:${PGID:-1000}

services:
  radarr:
    <<: *servarr
    image: linuxserver/radarr:6.4.4.10685-ls327@sha256:7a20f20de63706eee2ff6e4ac1f989a70c961f456aa47ccb6c78f2bb7657d9ae
    environment:
      <<: *servarr-env
      RADARR__AUTH__APIKEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
      RADARR__LOG__ANALYTICSENABLED: "False"
    volumes:
      - ./.run/radarr:/config
      - ./.run/data:/data
    ports: ["127.0.0.1:17878:7878"]

  sonarr:
    <<: *servarr
    image: linuxserver/sonarr:4.0.20.3014-ls5@sha256:c7d1df25e428da6c9ace05daea0d34e59522978a3843ea1944812f855af4086c
    environment:
      <<: *servarr-env
      SONARR__AUTH__APIKEY: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
      SONARR__LOG__ANALYTICSENABLED: "False"
    volumes:
      - ./.run/sonarr:/config
      - ./.run/data:/data
    ports: ["127.0.0.1:18989:8989"]

  bazarr:
    <<: *servarr
    image: linuxserver/bazarr:v1.6.2-ls372@sha256:832820dec70bce9e912c6eee7a95baf6551e03dbc63325a7208daaa455423752
    # API key and the Radarr/Sonarr connections are seeded into config.yaml by up.sh.
    volumes:
      - ./.run/bazarr:/config
      - ./.run/data:/data
    ports: ["127.0.0.1:16767:6767"]

  jellyfin:
    image: jellyfin/jellyfin:12.4.20261026-211555@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    # The API key is inserted by the seeder (Jellyfin has no setting for a fixed key).
    volumes:
      - ./.run/jellyfin/config:/config
      - ./.run/jellyfin/cache:/cache
      - ./.run/data:/data
    ports: ["127.0.0.1:18096:8096"]

  # Runs the seeder and the probes inside the dev image, on this network, with the same
  # /data view as the apps. Not started by `up`; used through `run`.
  tools:
    image: ${DEV_IMAGE:-fukku-dev:local}
    profiles: [tools]
    user: ${PUID:-1000}:${PGID:-1000}
    working_dir: /src
    environment:
      FUKKU_TEST_RADARR_URL: http://radarr:7878
      FUKKU_TEST_RADARR_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      FUKKU_TEST_SONARR_URL: http://sonarr:8989
      FUKKU_TEST_SONARR_KEY: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      FUKKU_TEST_BAZARR_URL: http://bazarr:6767
      FUKKU_TEST_BAZARR_KEY: "cccccccccccccccccccccccccccccccc"
      FUKKU_TEST_JELLYFIN_URL: http://jellyfin:8096
      FUKKU_TEST_JELLYFIN_KEY: "dddddddddddddddddddddddddddddddd"
      FUKKU_TEST_JELLYFIN_DB: /jellyfin-config/data/jellyfin.db
      FUKKU_TEST_DATA: /data
      FUKKU_TEST_RESULTS: /src/test/env/.run/results
    volumes:
      - ../..:/src
      - ./.run/data:/data
      - ./.run/jellyfin/config:/jellyfin-config

  # ---- Fukku itself (profile fukku; `make dev-up`, `make dev-down`) -------------------------
  #
  # The test stack contract (issue #30):
  #   UI and API through the proxy   http://127.0.0.1:18080   (in the network: http://fukku-proxy:8080)
  #   proxy control API              http://127.0.0.1:18081   (in the network: http://fukku-proxy:8081)
  #   the web process directly       http://fukku-web:8080    (403 to anyone but the proxy)
  #   users: user1, user2 (groups users) and admin1 (users,media-admins), <name>@example.com;
  #   chosen with the cookie fukku_test_user, set by GET /__test/login?user=<name>
  # The proxy's control API (all POST, JSON): /control/session {"mode": "ok|expired-401|expired-302"},
  # /control/cut {"afterBytes": N, "times": N}, /control/reset. See test/env/proxy.
  #
  # Needs `make image` (fukku:dev) and `make env-up`. fukku-web also joins this file's default
  # network to reach Radarr and Sonarr; only the proxy's address is trusted.

  fukku-web:
    <<: *fukku-hardening
    profiles: [fukku]
    image: ${FUKKU_IMAGE:-fukku:dev}
    command: ["web"]
    environment:
      <<: *fukku-env
      # API keys go to the web process only; the worker refuses to start with any.
      FUKKU_RADARR_API_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      FUKKU_SONARR_API_KEY: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    volumes:
      - ./fukku.yaml:/config/fukku.yaml:ro
      - ./.run/fukku/data:/var/lib/fukku
      - ./.run/fukku/spool:/spool
      - ./.run/data:/data
    networks:
      default: {}
      fukku: {}
    expose: ["8080"]

  fukku-worker:
    <<: *fukku-hardening
    profiles: [fukku]
    image: ${FUKKU_IMAGE:-fukku:dev}
    command: ["worker"]
    network_mode: none
    environment: *fukku-env
    volumes:
      - ./fukku.yaml:/config/fukku.yaml:ro
      - ./.run/fukku/spool:/spool
      - ./.run/data:/data:ro
      - ./.run/data/intake:/data/intake
    healthcheck:
      test: ["CMD", "fukku", "healthcheck", "--worker"]
      interval: 10s
      timeout: 5s
      start_period: 10s
    pids_limit: 256

  # The tools container on both networks, to reach the proxy by name from inside the stack
  # (`docker compose --profile fukku run --rm tools-fukku ...`). `tools` alone cannot see the
  # proxy, which is on the fukku network only.
  tools-fukku:
    extends: tools
    profiles: [fukku]
    networks:
      default: {}
      fukku: {}

  fukku-proxy:
    profiles: [fukku]
    # The test proxy (test/env/proxy): dev-up builds it into .cache/bin, the dev image runs it.
    image: ${DEV_IMAGE:-fukku-dev:local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: ${PUID:-1000}:${PGID:-1000}
    command:
      - /src/.cache/bin/proxy
      - -listen=:8080
      - -control=:8081
      - -upstream=http://fukku-web:8080
      - -signin-url=http://127.0.0.1:18080/__test/signin
    volumes:
      - ../..:/src:ro
    healthcheck:
      test: ["CMD", "/src/.cache/bin/proxy", "-healthcheck=127.0.0.1:8081"]
      interval: 10s
      timeout: 5s
      start_period: 5s
    depends_on:
      fukku-web: {condition: service_healthy}
    networks:
      fukku:
        ipv4_address: ${FUKKU_DEV_PROXY_IP:-172.30.77.10}
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"

# A private network with a fixed subnet, so auth.trustedProxies can name the proxy's one
# address. If the range is taken on your host, set FUKKU_DEV_SUBNET (a /24) before dev-up.
networks:
  fukku:
    ipam:
      config:
        - subnet: ${FUKKU_DEV_SUBNET:-172.30.77.0/24}
